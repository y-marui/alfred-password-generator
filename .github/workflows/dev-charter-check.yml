name: Dev Charter

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "42 6 * * 3"  # Every Wed 06:42 UTC
  workflow_dispatch:

jobs:
  check:
    if: github.actor != 'dependabot[bot]'
    uses: y-marui/dev-charter/.github/workflows/check-charter.yml@main
    with:
      prefix: docs/dev-charter
    permissions:
      contents: write
      pull-requests: write
      actions: read
